<head>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#f5f0e8 0%,#eee5d8 100%);
  color:#2d261f;
}
button,input{font:inherit}
.header{
  background:#182433;
  color:#fff;
  padding:20px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.header h1{margin:0;font-size:26px}
.header-actions{display:flex;gap:10px;align-items:center}
.small-btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
}
.logout{background:#fff;color:#182433}
.page{max-width:1200px;margin:auto;padding:28px 18px 50px}
.card{
  background:#fff;
  border-radius:18px;
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.login-card{
  max-width:460px;
  margin:50px auto;
}
.login-card h2{margin-top:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
.field input{
  border:1px solid #c8bcae;
  border-radius:10px;
  padding:13px 14px;
  outline:none;
}
.field input:focus{
  border-color:#b27d27;
  box-shadow:0 0 0 3px rgba(178,125,39,.12);
}
.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  background:linear-gradient(180deg,#e8b94f,#ce8c24);
  color:#211708;
  font-weight:800;
  cursor:pointer;
}
.primary:disabled{opacity:.6;cursor:not-allowed}
.message{
  display:none;
  margin-top:14px;
  padding:12px 14px;
  border-radius:10px;
  font-weight:700;
}
.message.error{display:block;background:#fdecea;color:#8a241e}
.message.ok{display:block;background:#eef8ec;color:#2d5d29}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.toolbar-left{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input{
  min-width:260px;
  border:1px solid #c8bcae;
  border-radius:10px;
  padding:11px 12px;
}
.refresh{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#182433;
  color:#fff;
  cursor:pointer;
  font-weight:700;
}
.summary{
  color:#6d645b;
  font-weight:700;
}
.table-wrap{
  overflow:auto;
  border-radius:14px;
  border:1px solid #e3d9cc;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
  background:#fff;
}
th,td{
  padding:13px 12px;
  border-bottom:1px solid #eee6dd;
  text-align:left;
  vertical-align:top;
}
th{
  background:#f4eee6;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.3px;
  position:sticky;
  top:0;
}
tr:last-child td{border-bottom:0}
.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}
.status.reserved{background:#fff3cd;color:#7a5a00}
.status.paid{background:#dff4df;color:#236b2b}
.status.other{background:#ececec;color:#555}
.status.expired{background:#f1e3e1;color:#8a3d35}
.pay-btn{
  border:0;
  border-radius:9px;
  padding:9px 11px;
  background:#2f7d32;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}
.pay-btn:disabled{background:#b9b9b9;cursor:not-allowed}
  .change-seats-btn{
  border:0;
  border-radius:9px;
  padding:9px 11px;
  background:#b27d27;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  margin-top:7px;
}

.change-seats-btn:hover{
  background:#94651f;
}
.cancel-btn{
  border:0;
  border-radius:9px;
  padding:9px 11px;
  background:#b3362d;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  margin-top:7px;
}
.cancel-btn:disabled{background:#b9b9b9;cursor:not-allowed}
.muted{color:#7f756b;font-size:13px}
  /* =========================================
   ZMĚNA MÍST – MODÁLNÍ OKNO
========================================= */

.change-modal{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.change-modal-box{
  position:relative;
  width:min(700px,100%);
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:18px;
  padding:26px;
  box-shadow:0 20px 60px rgba(0,0,0,.30);
}

.change-modal-box h2{
  margin:0 45px 8px 0;
  color:#182433;
}

.change-modal-close{
  position:absolute;
  top:12px;
  right:14px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#eee6dd;
  color:#182433;
  font-size:26px;
  line-height:1;
  cursor:pointer;
}

.change-seats-plan{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:22px 0;
}

.change-table{
  border:1px solid #ddd2c5;
  border-radius:12px;
  padding:10px;
  background:#f8f4ef;
  text-align:center;
}

.change-table-title{
  font-weight:800;
  margin-bottom:8px;
}

.change-table-seats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.change-seat{
  min-height:38px;
  border:1px solid #c9bbaa;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
  font-weight:800;
}

.change-seat.selected{
  background:#d5a536;
  color:#211708;
  border-color:#b27d27;
}

.change-seat.occupied{
  background:#b3362d;
  color:#fff;
  border-color:#962b24;
  cursor:not-allowed;
}

.change-seats-legend{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  margin:0 0 20px;
  font-size:14px;
  font-weight:700;
}

@media(max-width:700px){
  .change-modal{
    padding:8px;
  }

  .change-modal-box{
    padding:20px 12px;
    max-height:96vh;
  }

  .change-seats-plan{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .change-table{
    padding:8px;
  }

  .change-table-seats{
    grid-template-columns:repeat(2,1fr);
  }

  .change-seat{
    min-height:44px;
  }
}
.hidden{display:none!important}
@media(max-width:700px){

  tbody,tr,td{display:block;width:100%}

  td{display:grid;grid-template-columns:105px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid #eee6dd;align-items:start;overflow-wrap:anywhere}
  td::before{content:attr(data-label);font-size:11px;font-weight:800;color:#7f756b;text-transform:uppercase;letter-spacing:.35px}
  td:first-child{padding-top:0}
  td:last-child{border-bottom:0;padding-bottom:0}
  td[data-label="Jméno"]{font-size:18px}

 td[data-label="Akce"] .pay-btn,
td[data-label="Akce"] .change-seats-btn,
td[data-label="Akce"] .cancel-btn{
  width:100%;

}

<script>
const SUPABASE_URL = "https://krlmpfuifkjqemhhtidp.supabase.co";
const SUPABASE_KEY = "sb_publishable_3RBrTlTzK9OGSsDpSnxZUQ_PP3mTI3I";
const ADMIN_EMAIL = "barboratillova27@gmail.com";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginSection = document.getElementById("loginSection");
const adminSection = document.getElementById("adminSection");
const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const loginMessage = document.getElementById("loginMessage");
const logoutButton = document.getElementById("logoutButton");
const adminEmail = document.getElementById("adminEmail");

const refreshButton = document.getElementById("refreshButton");
const adminMessage = document.getElementById("adminMessage");
const reservationSummary = document.getElementById("reservationSummary");
const searchInput = document.getElementById("searchInput");

let reservations = [];
  let changingReservation = null;
let selectedChangedSeats = [];
let occupiedSeatsForChange = [];

const changeSeatsModal = document.getElementById("changeSeatsModal");
const closeChangeSeats = document.getElementById("closeChangeSeats");
const changeSeatsReservation = document.getElementById("changeSeatsReservation");
const changeSeatsPlan = document.getElementById("changeSeatsPlan");

const saveChangedSeats = document.getElementById("saveChangedSeats");
const changeSeatsMessage = document.getElementById("changeSeatsMessage");

function showMessage(el, text, type="error"){
  el.textContent = text;
  el.className = "message " + type;
}

function clearMessage(el){
  el.textContent = "";
  el.className = "message";
}
  function seatKey(table, seat){
  return `${table}-${seat}`;
}

function updateChangedSeatsCount(){
  changeSeatsCount.textContent =
    `Vybráno: ${selectedChangedSeats.length} míst`;
}

function renderChangeSeatsPlan(){

  changeSeatsPlan.innerHTML = "";

  for(let table = 1; table <= 16; table++){

    const tableBox = document.createElement("div");
    tableBox.className = "change-table";

    const title = document.createElement("div");
    title.className = "change-table-title";
    title.textContent = `STŮL ${table}`;

    const seatsBox = document.createElement("div");
    seatsBox.className = "change-table-seats";

    for(let seat = 1; seat <= 8; seat++){

      const button = document.createElement("button");
      button.type = "button";
      button.className = "change-seat";
      button.textContent = seat;

      const key = seatKey(table, seat);

      const isOccupied =
        occupiedSeatsForChange.some(
          s => seatKey(s.table_number, s.seat_number) === key
        );

      const isSelected =
        selectedChangedSeats.some(
          s => seatKey(s.table, s.seat) === key
        );

      if(isOccupied && !isSelected){
        button.classList.add("occupied");
        button.disabled = true;
      }

      if(isSelected){
        button.classList.add("selected");
      }

      button.addEventListener("click", () => {

        const index = selectedChangedSeats.findIndex(
          s => seatKey(s.table, s.seat) === key
        );

        if(index >= 0){
          selectedChangedSeats.splice(index, 1);
        }else{
          selectedChangedSeats.push({
            table,
            seat
          });
        }

        renderChangeSeatsPlan();
        updateChangedSeatsCount();
      });

      seatsBox.appendChild(button);
    }

    tableBox.appendChild(title);
    tableBox.appendChild(seatsBox);
    changeSeatsPlan.appendChild(tableBox);
  }

  updateChangedSeatsCount();
}

function formatDate(value){
  if(!value) return "—";
  const d = new Date(value);
  return d.toLocaleString("cs-CZ", {
    day:"2-digit",
    month:"2-digit",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function formatMoney(value){
  return Number(value || 0).toLocaleString("cs-CZ") + " Kč";
}

function statusLabel(status){
  if(status === "paid"){
    return '<span class="status paid">ZAPLACENO</span>';
  }
  if(status === "reserved"){
    return '<span class="status reserved">ČEKÁ NA PLATBU</span>';
  }
  if(status === "cancelled"){
    return '<span class="status other">STORNOVÁNO</span>';
  }
  if(status === "expired"){
    return '<span class="status expired">VYPRŠELO</span>';
  }
  return `<span class="status other">${String(status || "—").toUpperCase()}</span>`;
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function renderReservations(){
  const query = searchInput.value.trim().toLowerCase();

  const filtered = reservations.filter(r => {
    if(!query) return true;
    const haystack = [
      r.id,
      r.first_name,
      r.last_name,
      r.email,
      r.phone,
      r.seats,
      r.status
    ].join(" ").toLowerCase();

    return haystack.includes(query);
  });

  const paidCount = reservations.filter(r => r.status === "paid").length;
  const reservedCount = reservations.filter(r => r.status === "reserved").length;
  const expiredCount = reservations.filter(r => r.status === "expired").length;
  const cancelledCount = reservations.filter(r => r.status === "cancelled").length;

  const paidReservations = reservations.filter(r => r.status === "paid");
  const paidSeats = paidReservations.reduce(
    (sum, r) => sum + Number(r.seat_count || 0),
    0
  );
  const paidAmount = paidReservations.reduce(
    (sum, r) => sum + Number(r.total_price || 0),
    0
  );

  reservationSummary.innerHTML =
    `<strong>Celkem ${reservations.length} rezervací</strong> • ` +
    `čeká ${reservedCount} • zaplaceno ${paidCount} • vypršelo ${expiredCount} • stornováno ${cancelledCount}` +
    `<br><br><strong>ZAPLACENÁ MÍSTA: ${paidSeats}</strong> • ` +
    `<strong>CELKEM PŘIJATO: ${paidAmount.toLocaleString("cs-CZ")} Kč</strong>`;

  if(filtered.length === 0){
    reservationRows.innerHTML =
      '<tr><td colspan="10" style="text-align:center;padding:28px">Žádné rezervace nenalezeny.</td></tr>';
    return;
  }

  reservationRows.innerHTML = filtered.map(r => {
    const contact =
      `${escapeHtml(r.email || "—")}<br>` +
      `<span class="muted">${escapeHtml(r.phone || "Telefon neuveden")}</span>`;

    let action = "";

   if(r.status === "paid"){
  action =
    '<button class="pay-btn" disabled>ZAPLACENO</button>' +
    `<br><button class="change-seats-btn" data-change-id="${r.id}">ZMĚNIT MÍSTA</button>` +
    `<br><button class="cancel-btn" data-cancel-id="${r.id}">STORNOVAT REZERVACI</button>`;
    }else if(r.status === "cancelled"){
      action = '<button class="cancel-btn" disabled>STORNOVÁNO</button>';
    }else if(r.status === "expired"){
      action = '<button class="cancel-btn" disabled>VYPRŠELO</button>';
   }else{
  action =
    `<button class="pay-btn" data-id="${r.id}">POTVRDIT PLATBU</button>` +
    `<br><button class="change-seats-btn" data-change-id="${r.id}">ZMĚNIT MÍSTA</button>` +
    `<br><button class="cancel-btn" data-cancel-id="${r.id}">STORNOVAT REZERVACI</button>`;
}

    return `
      <tr>
        <td data-label="ID">${r.id}</td>
        <td data-label="Jméno"><strong>${escapeHtml(r.first_name)} ${escapeHtml(r.last_name)}</strong></td>
        <td data-label="Kontakt">${contact}</td>
        <td data-label="Místa">${escapeHtml(r.seats || "—")}</td>
        <td data-label="Počet">${r.seat_count ?? 0}</td>
        <td data-label="Cena"><strong>${formatMoney(r.total_price)}</strong></td>
        <td data-label="Vytvořeno">${formatDate(r.created_at)}</td>
        <td data-label="Platnost do">${formatDate(r.expires_at)}</td>
        <td data-label="Stav">${statusLabel(r.status)}</td>
        <td data-label="Akce">${action}</td>
      </tr>
    `;
  }).join("");

  document.querySelectorAll(".pay-btn[data-id]").forEach(button => {
    button.addEventListener("click", () => markPaid(Number(button.dataset.id), button));
  });

  document.querySelectorAll(".cancel-btn[data-cancel-id]").forEach(button => {
    button.addEventListener("click", () => cancelReservation(Number(button.dataset.cancelId), button));
  });
  document.querySelectorAll(".change-seats-btn[data-change-id]").forEach(button => {
  button.addEventListener("click", () => {
    openChangeSeats(Number(button.dataset.changeId));
  });
});
  
}

  async function openChangeSeats(id){

  clearMessage(changeSeatsMessage);

  const reservation = reservations.find(
    r => Number(r.id) === Number(id)
  );

  if(!reservation){
    showMessage(
      adminMessage,
      "Rezervace nebyla nalezena."
    );
    return;
  }

  changingReservation = reservation;

  // Načteme všechna aktuálně obsazená místa
  const { data, error } = await supabaseClient
    .rpc("get_occupied_seats");

  if(error){
    console.error(error);
    showMessage(
      adminMessage,
      "Nepodařilo se načíst obsazená místa."
    );
    return;
  }

  occupiedSeatsForChange = data || [];

  // Z textu rezervace zjistíme její současná místa
  selectedChangedSeats = String(reservation.seats || "")
    .split(",")
    .map(item => item.trim())
    .map(item => {

      const match = item.match(
        /Stůl\s+(\d+)\s*\/\s*místo\s+(\d+)/i
      );

      return match
        ? {
            table: Number(match[1]),
            seat: Number(match[2])
          }
        : null;
    })
    .filter(Boolean);

  changeSeatsReservation.textContent =
    `Rezervace č. ${reservation.id} – ${reservation.first_name} ${reservation.last_name}`;

  renderChangeSeatsPlan();

  changeSeatsModal.classList.remove("hidden");
}
async function loadReservations(){
  clearMessage(adminMessage);
  refreshButton.disabled = true;
  refreshButton.textContent = "Načítám…";

  const { data, error } = await supabaseClient.rpc("get_admin_reservations");

  refreshButton.disabled = false;
  refreshButton.textContent = "Obnovit";

  if(error){
    console.error(error);
    showMessage(adminMessage, "Rezervace se nepodařilo načíst. Zkuste se odhlásit a znovu přihlásit.");
    return;
  }

  reservations = data || [];
  renderReservations();
}

async function markPaid(id, button){
  const reservation = reservations.find(r => Number(r.id) === Number(id));
  const name = reservation ? `${reservation.first_name} ${reservation.last_name}` : `ID ${id}`;

  if(!confirm(`Potvrdit přijatou platbu pro rezervaci ${name}?`)){
    return;
  }

  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = "UKLÁDÁM…";

  const { error } = await supabaseClient.rpc("mark_reservation_paid", {
    p_reservation_id: id
  });

  if(error){
    console.error(error);
    button.disabled = false;
    button.textContent = originalText;
    showMessage(adminMessage, "Platbu se nepodařilo potvrdit.");
    return;
  }

  // Platba je potvrzena. Nyní odešleme zákazníkovi potvrzovací e-mail.
  let emailSent = false;

  if(reservation){
    try{
      const seatsForEmail = String(reservation.seats || "")
        .split(",")
        .map(item => item.trim())
        .map(item => {
          const match = item.match(/Stůl\s+(\d+)\s*\/\s*místo\s+(\d+)/i);
          return match
            ? { table: Number(match[1]), seat: Number(match[2]) }
            : null;
        })
        .filter(Boolean);

      const { error: emailError } = await supabaseClient.functions.invoke(
        "send-payment-confirmation",
        {
          body: {
            email: reservation.email,
            first_name: reservation.first_name,
            last_name: reservation.last_name,
            reservation_id: reservation.id,
            seats: seatsForEmail,
            total_price: Number(reservation.total_price || 0)
          }
        }
      );

      if(emailError){
        console.error("Potvrzovací e-mail se nepodařilo odeslat:", emailError);
      }else{
        emailSent = true;
      }
    }catch(emailException){
      console.error("Chyba při odesílání potvrzení platby:", emailException);
    }
  }

  if(emailSent){
    showMessage(
      adminMessage,
      "Platba byla potvrzena a zákazníkovi byl odeslán potvrzovací e-mail.",
      "ok"
    );
  }else{
    showMessage(
      adminMessage,
      "Platba byla potvrzena, ale potvrzovací e-mail se nepodařilo odeslat."
    );
  }

  await loadReservations();
}


async function cancelReservation(id, button){
  const reservation = reservations.find(r => Number(r.id) === Number(id));
  const name = reservation ? `${reservation.first_name} ${reservation.last_name}` : `ID ${id}`;

  if(!confirm(`Opravdu chcete stornovat rezervaci ${name}? Místa se tím uvolní pro další zájemce.`)){
    return;
  }

  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = "STORNUJI…";

  const { error } = await supabaseClient.rpc("cancel_reservation", {
    p_reservation_id: id
  });

    console.error(error);
    button.disabled = false;

async function showAdmin(session){
  const email = session?.user?.email || "";

  if(email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
    await supabaseClient.auth.signOut();
    loginSection.classList.remove("hidden");
    adminSection.classList.add("hidden");
    logoutButton.classList.add("hidden");
    adminEmail.textContent = "";
    showMessage(loginMessage, "Tento účet nemá oprávnění k administraci.");
    return;
  }

  loginSection.classList.add("hidden");
  adminSection.classList.remove("hidden");
  logoutButton.classList.remove("hidden");
  adminEmail.textContent = email;
  await loadReservations();
}

loginForm.addEventListener("submit", async event => {
  event.preventDefault();
  clearMessage(loginMessage);

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  loginButton.disabled = true;
  loginButton.textContent = "PŘIHLAŠUJI…";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  loginButton.disabled = false;
  loginButton.textContent = "PŘIHLÁSIT";

  if(error){
    console.error(error);
    showMessage(loginMessage, "Přihlášení se nepodařilo. Zkontrolujte e-mail a heslo.");
    return;
  }

  const ADMIN_EMAIL = "barboratillova27@gmail.com";

if (
    !data.session?.user?.email ||

) {

    return;
}

await showAdmin(data.session);
});

// Po změně míst zavoláme e-mailovou funkci.

if(emailError){
